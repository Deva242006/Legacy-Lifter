# =====================================================
# Development Profile
# =====================================================

spring:
  config:
    activate:
      on-profile: dev

  # PostgreSQL (Docker Compose)
  datasource:
    url: jdbc:postgresql://localhost:5432/legacylifter
    username: legacylifter
    password: legacylifter_dev
    driver-class-name: org.postgresql.Driver

  # Show SQL in dev
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate

  # Redis
  data:
    redis:
      host: localhost
      port: 6379

  # Spring AI — use Ollama locally
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: codellama:13b

# Dev logging
logging:
  level:
    com.legacylifter: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
