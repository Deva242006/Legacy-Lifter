# =====================================================
# LegacyLifter — Common Application Configuration
# =====================================================

spring:
  application:
    name: legacy-lifter

  # Virtual Threads (Project Loom)
  threads:
    virtual:
      enabled: true

  # JPA / Hibernate
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  # Flyway
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # File Upload
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  # Jackson
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  # Kafka (disabled by default — activate with 'kafka' profile)
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.legacylifter.event
      auto-offset-reset: earliest
      group-id: legacy-lifter

  # Redis
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 5000ms

  # Spring AI (defaults — overridden in profile-specific files)
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:sk-placeholder}
      chat:
        options:
          model: gpt-4o
          temperature: 0.2
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: codellama:13b
          temperature: 0.2

# =====================================================
# Server Configuration
# =====================================================
server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

# =====================================================
# Actuator / Observability
# =====================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: legacy-lifter
  endpoint:
    health:
      show-details: always

# =====================================================
# SpringDoc OpenAPI
# =====================================================
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

# =====================================================
# LegacyLifter Custom Properties
# =====================================================
legacylifter:
  events:
    use-kafka: false
  storage:
    base-path: ${java.io.tmpdir}/legacylifter/projects
  analysis:
    max-file-size-kb: 500
    timeout-seconds: 300

# =====================================================
# Logging
# =====================================================
logging:
  level:
    com.legacylifter: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
