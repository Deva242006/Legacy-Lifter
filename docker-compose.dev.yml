version: '3.9'

# =====================================================================
# LegacyLifter — Development Overrides
# Run with: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
# Or simply: docker-compose -f docker-compose.dev.yml up   (infra only)
# =====================================================================

services:

  # ─── PostgreSQL dev (no password required for ease) ───────────────
  postgres:
    environment:
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"

  # ─── Redis dev (no password) ───────────────────────────────────────
  redis:
    command: redis-server --appendonly yes
    environment:
      REDIS_PASSWORD: ""
    ports:
      - "6379:6379"

  # ─── Kafka exposed on localhost:29092 for local Spring Boot ────────
  kafka:
    ports:
      - "29092:29092"
      - "9092:9092"

  # ─── Kafka UI (dev tool for inspecting topics) ─────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: ll-kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  # ─── pgAdmin (dev tool for PostgreSQL) ─────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ll-pgadmin
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@legacylifter.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  pgadmin_data:
