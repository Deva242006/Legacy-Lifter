# =====================================================
# LegacyLifter — Development Docker Compose
# =====================================================
# Usage: docker-compose -f docker-compose.dev.yml up -d

services:
  # ---- PostgreSQL with PGVector ----
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ll-postgres
    environment:
      POSTGRES_DB: legacylifter
      POSTGRES_USER: legacylifter
      POSTGRES_PASSWORD: legacylifter_dev
    ports:
      - "5432:5432"
    volumes:
      - ll_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legacylifter"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Redis ----
  redis:
    image: redis:7-alpine
    container_name: ll-redis
    ports:
      - "6379:6379"
    volumes:
      - ll_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Zookeeper (required by Kafka) ----
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: ll-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  # ---- Apache Kafka ----
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: ll-kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ---- Ollama (Local LLM) ----
  ollama:
    image: ollama/ollama:latest
    container_name: ll-ollama
    ports:
      - "11434:11434"
    volumes:
      - ll_ollama_data:/root/.ollama

volumes:
  ll_postgres_data:
  ll_redis_data:
  ll_ollama_data:
